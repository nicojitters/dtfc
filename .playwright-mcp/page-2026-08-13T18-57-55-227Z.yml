            - listitem [ref=f2e117]: Read aloud, together, many times.
            - listitem [ref=f2e118]: Choose favorite lines first.
            - listitem [ref=f2e119]: Speak the rhythm before the words.
            - listitem [ref=f2e120]: Try different voices and stances.
            - listitem [ref=f2e121]: Perform for a friend before the mirror.
