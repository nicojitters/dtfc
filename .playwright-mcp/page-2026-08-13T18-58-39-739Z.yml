          - paragraph [ref=f3e110]: DT:FC Method
          - heading "Never Think or Say the Word “Memorize”" [level=2] [ref=f3e111]
          - paragraph [ref=f3e112]: Shakespeare wrote inside an oral tradition. His actors learned parts by ear, like learning a song.
          - list [ref=f3e113]:
            - listitem [ref=f3e114]: Read aloud, together, many times.
            - listitem [ref=f3e115]: Choose favorite lines first.
            - listitem [ref=f3e116]: Speak the rhythm before the words.
            - listitem [ref=f3e117]: Try different voices and stances.
            - listitem [ref=f3e118]: Perform for a friend before the mirror.
          - blockquote [ref=f3e119]:
            - text: Read the plays aloud, even if by yourself.
            - strong [ref=f3e120]: Be fearless.
            - text: Experiment. Shakespeare did.
